<section class="auth">
  <div class="brand"><span>✦</span> manga <em>studio</em></div>
  <div class="auth-card">
    <span class="eyebrow">CREATOR ACCOUNT</span>
    <h1>{{state.authMode==='register' ? 'Start your studio.' : 'Welcome back.'}}</h1>
    <p>{{state.authMode==='register' ? 'Make a private space for your stories.' : 'Sign in to return to your projects.'}}</p>
    <form (ngSubmit)="state.authenticate()">
      <label *ngIf="state.authMode==='register'">Name
        <input [(ngModel)]="state.name" name="name" required>
      </label>
      <label>Email
        <input [(ngModel)]="state.email" name="email" type="email" required>
      </label>
      <label>Password
        <input [(ngModel)]="state.password" name="password" type="password" minlength="8" required>
      </label>
      <p class="auth-error" *ngIf="state.authError">{{state.authError}}</p>
      <button class="new" type="submit">{{state.authMode==='register' ? 'Create account' : 'Sign in'}}</button>
    </form>
    <button class="switch" (click)="state.authMode = state.authMode==='register' ? 'login' : 'register'; state.authError=''">
      {{state.authMode==='register' ? 'Already creating here? Sign in' : 'New to Manga Studio? Create an account'}}
    </button>
  </div>
</section>

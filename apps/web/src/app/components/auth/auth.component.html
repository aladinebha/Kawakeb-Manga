<section class="auth">
  <div class="hero">
    <h1 class="text-gradient">Kawakeb Manga Studio.</h1>
    <p class="subtitle">Where your stories eclipse the stars.</p>
  </div>
  
  <div class="auth-card glass-panel">
    <h2>{{state.authMode==='register' ? 'Start your journey' : 'Welcome back'}}</h2>
    <p class="auth-desc">{{state.authMode==='register' ? 'Create a private universe for your projects.' : 'Sign in to access your cosmic studio.'}}</p>
    
    <form (ngSubmit)="state.authenticate()">
      <div class="input-group" *ngIf="state.authMode==='register'">
        <input [(ngModel)]="state.name" name="name" placeholder="Creator Name" required>
      </div>
      <div class="input-group">
        <input [(ngModel)]="state.email" name="email" type="email" placeholder="Email Address" required>
      </div>
      <div class="input-group">
        <input [(ngModel)]="state.password" name="password" type="password" placeholder="Password" minlength="8" required>
      </div>
      
      <p class="auth-error" *ngIf="state.authError">{{state.authError}}</p>
      
      <button class="btn-primary" type="submit">{{state.authMode==='register' ? 'Create Account' : 'Sign In'}}</button>
    </form>
    
    <button class="btn-text" (click)="state.authMode = state.authMode==='register' ? 'login' : 'register'; state.authError=''">
      {{state.authMode==='register' ? 'Already have an account? Sign in' : 'New to Kawakeb? Create an account'}}
    </button>
  </div>
</section>

<app-starfield></app-starfield>
<ng-container *ngIf="state.user; else auth">
  <app-top-bar></app-top-bar>
  <app-studio-platform *ngIf="state.viewMode === 'studio'"></app-studio-platform>
  <app-reader-platform *ngIf="state.viewMode === 'reader'"></app-reader-platform>
</ng-container>

<ng-template #auth>
  <app-auth></app-auth>
</ng-template>
